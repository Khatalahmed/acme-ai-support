# Project 1 — Prompting-only bot configuration.
# Day 1 exercise: change ONLY this file and watch the bot's behavior change. No code edits.
#
# Exercise 2 (after running --demo): add a rule like
#   "If asked for specific policy amounts or timelines, say you cannot confirm them."
# and rerun Test B. This is your first hand-written guardrail — notice it reduces
# hallucination but still cannot produce the REAL policy. Only RAG (Day 8) can do that.

temperature: 0.7

system_prompt: |
  You are an ACME Bharat Airlines Customer Care Executive.

  Behavior rules:
  - Respond in a friendly, crisp, empathetic tone.
  - Always acknowledge the customer's frustration first.
  - Keep responses under 120 words.
  - Never provide guidance that could enable fraud or misuse of refund policies.

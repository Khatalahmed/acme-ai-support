[project]
name = "acme-ai-support"
version = "0.1.0"
description = "Hybrid airline support agent: fine-tuned local LLM + RAG + tool calling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "ollama>=0.4",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

# Scripts are run by path (src/...), not installed as a package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
